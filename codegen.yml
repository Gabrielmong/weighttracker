overwrite: true
ignoreNoDocuments: true
schema: 'schema.graphql'
generates:
  src/lib/graphql/generated/types.ts:
    plugins:
      - typescript
      - typescript-resolvers
  src/lib/graphql/generated/operations.ts:
    documents: 'src/features/**/graphql/*.graphql'
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
